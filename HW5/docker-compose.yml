version: '3.8'

services:
  # 1. PostgreSQL 資料庫服務
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js 後端微服務
  backend:
    build: ./backend
    container_name: node_backend
    restart: always
    environment:
      DB_HOST: db
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydb
      DB_PORT: 5432
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # 3. Python 微服務 (FastAPI)
  python:
    build: ./python
    container_name: python_api
    restart: always
    networks:
      - app-network

  # 4. Nginx 網頁伺服器與反向代理
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend
      - python
    networks:
      - app-network

  # 5. Adminer 資料庫管理後台
  adminer:
    image: adminer
    container_name: db_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge